<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Model Paper</title>

    <link
        rel="stylesheet"
        href="viewer.css"
    >

</head>

<body>

<header class="viewer-header">

    <div class="viewer-title">

        <div class="viewer-title-icon">
            📘
        </div>

        <div id="paperTitle">
            Model Paper
        </div>

    </div>


    <button
        type="button"
        class="back-button"
        id="backButton"
    >
        ← Back
    </button>

</header>


<main
    id="viewer"
    class="viewer"
>

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-icon"></div>

        <div class="loading-text">
            Loading Model Paper...
        </div>

    </div>

</main>


<script type="module">

import {
    db,
    doc,
    getDoc
} from "./firebase.js";


// =====================================================
// URL
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const paper =
    params.get("paper");


const studentId =
    params.get("id") ||
    sessionStorage.getItem(
        "studentId"
    );


const type =
    params.get("type") ||
    "al-model";


// =====================================================
// ELEMENTS
// =====================================================

const viewer =
    document.getElementById(
        "viewer"
    );


const paperTitle =
    document.getElementById(
        "paperTitle"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


// =====================================================
// BACK
// =====================================================

if (backButton) {

    backButton.addEventListener(
        "click",
        () => {

            history.back();

        }
    );

}


// =====================================================
// VALIDATE
// =====================================================

if (!paper) {

    showError(
        "No model paper was selected."
    );

}
else {

    loadPaper();

}


// =====================================================
// LOAD PAPER
// =====================================================

async function loadPaper() {

    try {

        const match =
            /^paper(\d{2})$/i.exec(
                paper
            );


        if (!match) {

            throw new Error(
                "Invalid paper number."
            );

        }


        const number =
            match[1];


        // =============================================
        // TITLE
        // =============================================

        if (paperTitle) {

            paperTitle.textContent =
                `A/L Model Paper ${number}`;

        }


        // =============================================
        // GET STUDENT
        // =============================================

        let studentData = {};


        if (studentId) {

            const studentRef =
                doc(
                    db,
                    "students",
                    studentId
                );


            const snapshot =
                await getDoc(
                    studentRef
                );


            if (
                snapshot.exists()
            ) {

                studentData =
                    snapshot.data();

            }

        }


        console.log(
            "======================================"
        );

        console.log(
            "A/L MODEL PAPER VIEWER"
        );

        console.log(
            "Paper:",
            paper
        );

        console.log(
            "Student:",
            studentId
        );

        console.log(
            "Type:",
            type
        );

        console.log(
            "======================================"
        );


        // =============================================
        // PAPER URL
        // =============================================
        //
        // USE EXISTING PDF STRUCTURE
        //
        // =============================================

        const candidates = [

            `papers/al/model/paper${number}.pdf`,

            `papers/al/paper${number}.pdf`,

            `papers/model/paper${number}.pdf`,

            `pdfs/al/model/paper${number}.pdf`,

            `pdfs/al/paper${number}.pdf`,

            `pdfs/model/paper${number}.pdf`

        ];


        const pdfPath =
            await findWorkingPDF(
                candidates
            );


        if (!pdfPath) {

            throw new Error(
                "Model Paper PDF was not found. Please check the PDF location in GitHub."
            );

        }


        console.log(
            "✅ PDF FOUND:",
            pdfPath
        );


        // =============================================
        // CREATE VIEWER
        // =============================================

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.className =
            "pdf-frame";


        iframe.title =
            `A/L Model Paper ${number}`;


        iframe.src =
            pdfPath +
            "#toolbar=0&navpanes=0&scrollbar=1";


        iframe.setAttribute(
            "allowfullscreen",
            ""
        );


        iframe.addEventListener(
            "load",
            () => {

                console.log(
                    "✅ Model Paper opened"
                );

            }
        );


        viewer.innerHTML = "";

        viewer.appendChild(
            iframe
        );


    }

    catch (error) {

        console.error(
            "A/L Model Paper error:",
            error
        );


        showError(
            error.message
        );

    }

}


// =====================================================
// FIND WORKING PDF
// =====================================================

async function findWorkingPDF(
    paths
) {

    for (
        const path of paths
    ) {

        try {

            console.log(
                "Checking:",
                path
            );


            const response =
                await fetch(
                    path,
                    {
                        method: "HEAD"
                    }
                );


            if (
                response.ok
            ) {

                return path;

            }

        }

        catch (
            error
        ) {

            console.warn(
                "Path check failed:",
                path
            );

        }

    }


    return null;

}


// =====================================================
// ERROR
// =====================================================

function showError(
    message
) {

    viewer.className =
        "viewer error";


    viewer.innerHTML = `

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Unable to Open Model Paper
            </h2>

            <p>
                ${message}
            </p>

            <button
                type="button"
                class="error-button"
                id="errorBack"
            >
                ← Go Back
            </button>

        </div>

    `;


    const errorBack =
        document.getElementById(
            "errorBack"
        );


    if (errorBack) {

        errorBack.addEventListener(
            "click",
            () => {

                history.back();

            }
        );

    }

}


// =====================================================
// SECURITY
// =====================================================

document.addEventListener(
    "contextmenu",
    event => {

        event.preventDefault();

    },
    true
);


document.addEventListener(
    "keydown",
    event => {

        const key =
            String(
                event.key
            ).toLowerCase();


        if (
            event.ctrlKey &&
            (
                key === "p" ||
                key === "s"
            )
        ) {

            event.preventDefault();

            event.stopPropagation();

        }

    },
    true
);

</script>

</body>

</html>
