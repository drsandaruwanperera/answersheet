<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reports</title>

    <link rel="stylesheet" href="reports.css">

</head>

<body>

<div class="sidebar">

    <h2>👨🏻‍💻 Admin</h2>

    <ul>

        <li onclick="location.href='admin.html'">
            📊 Dashboard
        </li>

        <li class="active">
            📈 Reports
        </li>

        <li id="logoutBtn">
            🚪 Logout
        </li>

    </ul>

</div>

<div class="main">

<header>

<h1>📈 Student Reports</h1>

</header>

<div class="cards">

<div class="card">

<h3>Total Students</h3>

<h2 id="totalStudents">0</h2>

</div>

<div class="card">

<h3>Total Paper Views</h3>

<h2 id="totalViews">0</h2>

</div>

<div class="card">

<h3>Average Progress</h3>

<h2 id="averageProgress">0%</h2>

</div>

<div class="card">

<h3>Completed Students</h3>

<h2 id="completedStudents">0</h2>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="🔍 Search Student">

<button id="exportBtn">
📄 Export CSV
</button>

<button onclick="window.print()">
🖨 Print
</button>

</div>

<table>

<thead>

<tr>

<th>Student ID</th>
<th>Viewed</th>
<th>Progress</th>
<th>Status</th>

</tr>

</thead>

<tbody id="reportTable">

</tbody>

</table>

</div>

<script src="session.js"></script>

<script type="module" src="reports.js"></script>

</body>

</html>
