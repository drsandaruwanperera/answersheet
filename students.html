<div id="addModal" class="modal-overlay">

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2>Add Student</h2>

                <p>
                    Create a new student account
                </p>
            </div>

            <button
                type="button"
                id="closeAdd"
                class="modal-close"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <!-- ================================
                 STUDENT CATEGORY
            ================================= -->

            <div class="form-group">

                <label>
                    Student Category
                </label>

                <div class="category-grid">

                    <button
                        type="button"
                        class="category-btn"
                        data-type="al"
                    >

                        🎓 A/L Student

                    </button>


                    <button
                        type="button"
                        class="category-btn"
                        data-type="grade10"
                    >

                        🎓 Grade 10

                    </button>


                    <button
                        type="button"
                        class="category-btn"
                        data-type="grade11"
                    >

                        🎓 Grade 11

                    </button>

                </div>


                <div
                    id="newStudentGrade"
                    class="selection-info"
                ></div>

            </div>


            <!-- ================================
                 A/L SERIES
            ================================= -->

            <div
                id="alSeriesSection"
                class="form-group"
                style="display:none;"
            >

                <label>
                    A/L Admission Series
                </label>

                <div class="al-series-grid">

                    <button
                        type="button"
                        class="al-series-btn"
                        data-series="27000"
                    >

                        <strong>
                            A27000
                        </strong>

                        <small>
                            Series
                        </small>

                    </button>


                    <button
                        type="button"
                        class="al-series-btn"
                        data-series="28000"
                    >

                        <strong>
                            A28000
                        </strong>

                        <small>
                            Series
                        </small>

                    </button>


                    <button
                        type="button"
                        class="al-series-btn"
                        data-series="29000"
                    >

                        <strong>
                            A29000
                        </strong>

                        <small>
                            Series
                        </small>

                    </button>

                </div>

            </div>


            <!-- ================================
                 STUDENT ID
            ================================= -->

            <div class="form-group">

                <label for="newStudentId">
                    Student ID
                </label>

                <input
                    type="text"
                    id="newStudentId"
                    placeholder="Select category first"
                    autocomplete="off"
                >

                <small
                    id="studentIdHelp"
                    class="field-help"
                >
                    A/L students will receive an
                    automatically generated ID.
                </small>

            </div>


            <!-- ================================
                 PASSWORD
            ================================= -->

            <div class="form-group">

                <label for="newStudentPassword">
                    Password
                </label>

                <input
                    type="text"
                    id="newStudentPassword"
                    placeholder="Enter Password"
                    autocomplete="off"
                >

            </div>


            <!-- ================================
                 FORCE PASSWORD
            ================================= -->

            <div class="checkbox-row">

                <input
                    type="checkbox"
                    id="newMustChange"
                >

                <label for="newMustChange">
                    Force password change on first login
                </label>

            </div>

        </div>


        <!-- ================================
             FOOTER
        ================================= -->

        <div class="modal-footer">

            <button
                type="button"
                id="cancelAdd"
                class="cancel-btn"
            >
                Cancel
            </button>


            <button
                type="button"
                id="saveNewStudent"
                class="save-btn"
            >
                💾 Save Student
            </button>

        </div>

    </div>

</div>
