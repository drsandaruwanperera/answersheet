<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="robots"
        content="noindex,nofollow"
    >

    <title>
        Protected Answer Viewer
    </title>

    <link
        rel="stylesheet"
        href="answer-viewer.css?v=1"
    >

</head>


<body>


<div class="viewer-page">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="viewer-header">


        <div class="viewer-header-left">


            <div class="viewer-icon">
                📖
            </div>


            <div class="viewer-heading">


                <span class="viewer-label">
                    STUDENT ANSWER
                </span>


                <h1 id="viewerTitle">
                    Loading Answer...
                </h1>


                <p id="viewerSubtitle">
                    Please wait...
                </p>


            </div>


        </div>



        <button
            type="button"
            id="backBtn"
            class="back-btn"
        >

            ← Back

        </button>


    </header>



    <!-- =====================================================
         PROTECTION NOTICE
    ====================================================== -->

    <section class="viewer-notice">


        <div class="notice-icon">
            🔒
        </div>


        <div class="notice-content">


            <strong>
                Protected Answer Viewer
            </strong>


            <p>
                This answer is available for viewing only.
                Download and printing are disabled.
            </p>


        </div>


    </section>



    <!-- =====================================================
         VIEWER
    ====================================================== -->

    <main
        class="pdf-viewer-wrapper"
        id="viewerWrapper"
    >


        <!-- LOADING -->

        <div
            id="loading"
            class="loading"
        >


            <div class="loading-spinner"></div>


            <strong>
                Loading answer...
            </strong>


            <span>
                Please wait.
            </span>


        </div>



        <!-- ERROR -->

        <div
            id="errorMessage"
            class="error-message"
            style="display:none;"
        >


            <div class="error-icon">
                ⚠️
            </div>


            <h2>
                Unable to Load Answer
            </h2>


            <p id="errorText">
                Please try again.
            </p>


            <button
                type="button"
                id="errorBackBtn"
                class="error-back-btn"
            >

                ← Go Back

            </button>


        </div>



        <!-- PDF CANVAS -->

        <div
            id="pdfCanvasContainer"
            class="pdf-canvas-container"
        ></div>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="viewer-footer">

        🔐 Student Assessment Portal

        <span>
            • Protected Viewing
        </span>

    </footer>


</div>



<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script
    type="module"
    src="answer-viewer.js?v=1"
></script>


</body>

</html>
