<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Answer Viewer</title>

    <link
        rel="icon"
        href="data:,"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #0f172a;
        }


        .viewer {

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

        }


        .viewer-header {

            height: 64px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 20px;

            background: #111827;

            color: white;

            flex-shrink: 0;

        }


        .viewer-title {

            font-size: 17px;
            font-weight: 700;

        }


        .viewer-subtitle {

            font-size: 12px;
            color: #94a3b8;

            margin-top: 3px;

        }


        .back-btn {

            border: none;

            background: #7c3aed;

            color: white;

            padding: 10px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 600;

        }


        .back-btn:hover {

            background: #6d28d9;

        }


        .pdf-area {

            flex: 1;

            position: relative;

            overflow: auto;

            background: #334155;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding: 20px;

        }


        #pdfCanvas {

            display: block;

            background: white;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.35);

            max-width: 100%;

        }


        .loading {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            color: white;

            font-size: 16px;

        }


        .error {

            position: absolute;

            top: 50%;
            left: 50%;

            transform:
                translate(-50%, -50%);

            width: min(
                90%,
                500px
            );

            background: white;

            padding: 30px;

            border-radius: 12px;

            text-align: center;

            color: #dc2626;

        }


        .controls {

            height: 55px;

            background: #111827;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 15px;

            flex-shrink: 0;

        }


        .controls button {

            border: none;

            background: #334155;

            color: white;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

        }


        .controls button:hover {

            background: #475569;

        }


        #pageInfo {

            color: #cbd5e1;

            font-size: 13px;

        }

    </style>

</head>


<body>


<div class="viewer">


    <!-- HEADER -->

    <header class="viewer-header">

        <div>

            <div
                class="viewer-title"
                id="viewerTitle"
            >
                Answer Viewer
            </div>

            <div
                class="viewer-subtitle"
                id="viewerSubtitle"
            >
                Student Assessment Portal
            </div>

        </div>


        <button
            type="button"
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>

    </header>


    <!-- PDF AREA -->

    <main class="pdf-area">

        <div
            class="loading"
            id="loading"
        >
            Loading answer...
        </div>


        <canvas
            id="pdfCanvas"
        ></canvas>


        <div
            class="error"
            id="error"
            style="display:none;"
        ></div>

    </main>


    <!-- CONTROLS -->

    <div class="controls">

        <button
            id="previousPage"
            type="button"
        >
            ← Previous
        </button>


        <span id="pageInfo">
            Page 1 / 1
        </span>


        <button
            id="nextPage"
            type="button"
        >
            Next →
        </button>

    </div>


</div>


<!-- PDF.JS -->

<script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
></script>


<script
    src="answer-viewer.js"
></script>


</body>

</html>
