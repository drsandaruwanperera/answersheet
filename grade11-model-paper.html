<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 TOP Ranking</title>

    <link
        rel="stylesheet"
        href="grade11-model-paper.css?v=6"
    >

</head>

<body>

<div class="container">

    <!-- ==========================
         Header
    =========================== -->

    <div class="header">

        <div>

            <h1 id="paperTitle">
                🏆 TOP Ranking - 01
            </h1>

            <p id="paperSubtitle">
                Grade 11 • TOP Ranking
            </p>

        </div>

        <button
            type="button"
            onclick="history.back()"
        >
            ← Back
        </button>

    </div>


    <!-- ==========================
         Parts
    =========================== -->

    <div class="part-grid">


        <!-- ==========================
             PART A
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📝
            </div>

            <h2>
                Part A
            </h2>

            <p>
                Multiple Choice Questions
            </p>


            <div class="option-grid">

                <button
                    id="mcqBtn"
                    type="button"
                >
                    📄 MCQ
                </button>


                <button
                    id="mcqAnswerBtn"
                    type="button"
                >
                    📝 MCQ Answer
                </button>

            </div>

        </div>


        <!-- ==========================
             PART B
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📚
            </div>

            <h2>
                Part B
            </h2>

            <p>
                Question Paper
            </p>


            <div class="option-grid">

                <button
                    id="questionBtn"
                    type="button"
                >
                    📄 Question Paper
                </button>


                <button
                    id="answerBtn"
                    type="button"
                >
                    📝 Answer Scheme
                </button>

            </div>

        </div>

    </div>

</div>


<script
    type="module"
    src="grade11-model-paper.js?v=6"
></script>

</body>

</html>
