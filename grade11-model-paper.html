<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 Model Paper</title>

    <link
        rel="stylesheet"
        href="grade11-model-paper.css"
    >

</head>

<body>

<div class="container">

    <div class="header">

        <div>

            <h1 id="paperTitle">
                📘 Model Paper
            </h1>

            <p id="paperSubtitle">
                Grade 11
            </p>

        </div>

        <button onclick="history.back()">
            ← Back
        </button>

    </div>


    <div class="part-grid">


        <!-- ==========================
             PART A
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📝
            </div>

            <h2>
                Part A
            </h2>

            <p>
                Multiple Choice Questions
            </p>


            <div class="option-grid">

                <button
                    id="mcqBtn"
                    type="button"
                >
                    📄 MCQ
                </button>


                <button
                    id="mcqAnswerBtn"
                    type="button"
                >
                    📝 MCQ Answer
                </button>

            </div>

        </div>


        <!-- ==========================
             PART B
        =========================== -->

        <div class="part-card">

            <div class="part-icon">
                📚
            </div>

            <h2>
                Part B
            </h2>

            <p>
                Question Paper
            </p>


            <div class="option-grid">

                <button
                    id="questionBtn"
                    type="button"
                >
                    📄 Question Paper
                </button>


                <button
                    id="answerBtn"
                    type="button"
                >
                    📝 Answer Scheme
                </button>

            </div>

        </div>

    </div>

</div>


<script
    type="module"
    src="grade11-model-paper.js"
></script>

</body>

</html>
