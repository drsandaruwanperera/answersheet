name: Crop A/L paper pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crop-paper-pages:
    if: ${{ !contains(github.event.head_commit.message, 'Crop A/L paper pages') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Crop white margins from A/L paper JPGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          roots = [
              Path('papers/al-top-ranking/september/paper-01-1st-paper'),
              Path('papers/al-top-ranking/september/paper-01-2nd-paper'),
          ]

          changed = 0
          for root in roots:
              for path in sorted(root.glob('page-*.jpg')):
                  with Image.open(path) as source:
                      image = source.convert('RGB')
                      gray = image.convert('L')
                      mask = gray.point(lambda p: 0 if p >= 245 else 255)
                      bbox = mask.getbbox()
                      if not bbox:
                          continue

                      left, top, right, bottom = bbox
                      pad = max(6, round(min(image.size) * 0.006))
                      left = max(0, left - pad)
                      top = max(0, top - pad)
                      right = min(image.width, right + pad)
                      bottom = min(image.height, bottom + pad)

                      cropped = image.crop((left, top, right, bottom))
                      cropped.save(path, 'JPEG', quality=94, optimize=True, progressive=True)
                      changed += 1
                      print(f'Cropped {path}: {image.size} -> {cropped.size}')

          print(f'Processed {changed} page images.')
          PY

      - name: Commit cropped pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/al-top-ranking/september/paper-01-1st-paper/*.jpg
          git add papers/al-top-ranking/september/paper-01-2nd-paper/*.jpg
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'Crop A/L paper pages'
          git push