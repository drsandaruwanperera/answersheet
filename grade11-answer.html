<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 Answer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;

            padding: 0;

            width: 100%;

            height: 100%;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            background:
                #f4f7fb;

            color:
                #0f172a;

            overflow: hidden;

        }


        /* =================================================
           HEADER
        ================================================= */

        .viewer-header {

            height: 70px;

            width: 100%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 24px;

            background:
                #ffffff;

            border-bottom:
                1px solid #e2e8f0;

            box-shadow:
                0 4px 18px
                rgba(15, 23, 42, 0.07);

            position:
                relative;

            z-index: 10;

        }


        /* =================================================
           TITLE
        ================================================= */

        .viewer-title {

            display: flex;

            align-items: center;

            gap: 10px;

            min-width: 0;

        }


        .viewer-title-icon {

            width: 42px;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 12px;

            background:
                #f0ebff;

            font-size:
                22px;

            flex-shrink: 0;

        }


        #answerTitle {

            font-size:
                18px;

            font-weight:
                800;

            color:
                #0f172a;

            white-space:
                nowrap;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

        }


        /* =================================================
           BACK BUTTON
        ================================================= */

        .back-button {

            height: 42px;

            padding:
                0 18px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            border: 0;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6d35f2,
                    #7c3aed
                );

            color:
                #ffffff;

            font-family:
                inherit;

            font-size:
                13px;

            font-weight:
                750;

            cursor:
                pointer;

            box-shadow:
                0 5px 14px
                rgba(109, 53, 242, 0.18);

            transition:
                transform .18s ease,
                box-shadow .18s ease;

            flex-shrink: 0;

        }


        .back-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(109, 53, 242, 0.25);

        }


        .back-button:active {

            transform:
                translateY(0);

        }


        /* =================================================
           PDF VIEWER
        ================================================= */

        .viewer {

            width: 100%;

            height:
                calc(100vh - 70px);

            background:
                #e5e7eb;

        }


        #answerFrame {

            display: block;

            width: 100%;

            height: 100%;

            border: 0;

            background:
                #ffffff;

        }


        /* =================================================
           LOADING
        ================================================= */

        .loading {

            width: 100%;

            height: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 14px;

            color:
                #64748b;

        }


        .loading-icon {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            border:
                4px solid #e2e8f0;

            border-top-color:
                #6d35f2;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .loading-text {

            font-size:
                14px;

            font-weight:
                600;

        }


        /* =================================================
           ERROR
        ================================================= */

        .error-screen {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                30px;

        }


        .error-card {

            width:
                min(520px, 100%);

            padding:
                40px 30px;

            text-align:
                center;

            background:
                #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius:
                20px;

            box-shadow:
                0 14px 40px
                rgba(15, 23, 42, 0.08);

        }


        .error-icon {

            font-size:
                48px;

            margin-bottom:
                15px;

        }


        .error-card h2 {

            margin:
                0 0 10px;

            font-size:
                22px;

        }


        .error-card p {

            margin:
                0 0 22px;

            color:
                #64748b;

            line-height:
                1.6;

        }


        .error-back {

            height:
                42px;

            padding:
                0 20px;

            border:
                0;

            border-radius:
                10px;

            background:
                #6d35f2;

            color:
                #ffffff;

            font-family:
                inherit;

            font-weight:
                700;

            cursor:
                pointer;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .viewer-header {

                height:
                    62px;

                padding:
                    0 12px;

            }


            .viewer-title-icon {

                width:
                    36px;

                height:
                    36px;

                font-size:
                    19px;

            }


            #answerTitle {

                font-size:
                    14px;

            }


            .back-button {

                height:
                    36px;

                padding:
                    0 13px;

                font-size:
                    12px;

            }


            .viewer {

                height:
                    calc(100vh - 62px);

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="viewer-header">


    <div class="viewer-title">

        <div class="viewer-title-icon">
            📖
        </div>

        <div id="answerTitle">
            Answer
        </div>

    </div>


    <button
        type="button"
        class="back-button"
        id="backButton"
    >
        ← Back
    </button>


</header>


<!-- =====================================================
     VIEWER
===================================================== -->

<main
    id="viewer"
    class="viewer"
>

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-icon"></div>

        <div class="loading-text">
            Loading Answer...
        </div>

    </div>

</main>


<script>


// =====================================================
// GET URL PARAMETERS
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const file =
    params.get("file");


const title =
    params.get("title") ||
    "Answer";


// =====================================================
// ELEMENTS
// =====================================================

const viewer =
    document.getElementById(
        "viewer"
    );


const answerTitle =
    document.getElementById(
        "answerTitle"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


// =====================================================
// SET TITLE
// =====================================================

if (answerTitle) {

    answerTitle.textContent =
        title;

}


// =====================================================
// BACK BUTTON
// =====================================================

if (backButton) {

    backButton.addEventListener(
        "click",
        function () {

            window.history.back();

        }
    );

}


// =====================================================
// VALIDATE FILE
// =====================================================

if (
    !file ||
    file.trim() === ""
) {

    showError(
        "No answer file was provided."
    );

}

else {

    loadAnswer(
        file
    );

}


// =====================================================
// LOAD ANSWER
// =====================================================

function loadAnswer(
    filePath
) {

    console.log(
        "================================"
    );

    console.log(
        "Grade 11 Answer Viewer"
    );

    console.log(
        "File:",
        filePath
    );

    console.log(
        "Title:",
        title
    );

    console.log(
        "================================"
    );


    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.id =
        "answerFrame";


    iframe.title =
        title;


    iframe.setAttribute(
        "allowfullscreen",
        ""
    );


    /*
     * Browser PDF viewer.
     *
     * toolbar=0 attempts to hide
     * the normal PDF toolbar where
     * the browser supports it.
     */

    iframe.src =
        filePath +
        "#toolbar=0&navpanes=0&scrollbar=1";


    iframe.addEventListener(
        "load",
        function () {

            console.log(
                "✅ Answer loaded"
            );

        }
    );


    iframe.addEventListener(
        "error",
        function () {

            showError(
                "Unable to load the answer file."
            );

        }
    );


    viewer.innerHTML = "";

    viewer.appendChild(
        iframe
    );

}


// =====================================================
// ERROR
// =====================================================

function showError(
    message
) {

    viewer.className =
        "error-screen";


    viewer.innerHTML = `

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Unable to Open Answer
            </h2>

            <p>
                ${message}
            </p>

            <button
                type="button"
                class="error-back"
                onclick="history.back()"
            >
                ← Go Back
            </button>

        </div>

    `;

}

</script>


</body>

</html>
