<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 11 Answer</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family:
                Inter,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #eef2f7;

            color: #0f172a;

            overflow: hidden;

        }


        /* =================================================
           HEADER
        ================================================= */

        .viewer-header {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 24px;

            background: #ffffff;

            border-bottom:
                1px solid #e2e8f0;

            box-shadow:
                0 4px 18px
                rgba(15, 23, 42, 0.08);

            position: relative;

            z-index: 100;

        }


        .viewer-title {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .viewer-title-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background: #f0ebff;

            font-size: 22px;

            flex-shrink: 0;

        }


        #answerTitle {

            font-size: 18px;

            font-weight: 800;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        /* =================================================
           BACK BUTTON
        ================================================= */

        .back-button {

            height: 42px;

            padding: 0 18px;

            border: 0;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #6d35f2,
                    #7c3aed
                );

            color: #ffffff;

            font-family: inherit;

            font-size: 13px;

            font-weight: 750;

            cursor: pointer;

            box-shadow:
                0 5px 14px
                rgba(109, 53, 242, 0.20);

            transition:
                transform .18s ease,
                box-shadow .18s ease;

        }


        .back-button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 8px 20px
                rgba(109, 53, 242, 0.28);

        }


        /* =================================================
           PDF AREA
        ================================================= */

        .viewer {

            width: 100%;

            height:
                calc(100vh - 70px);

            overflow-y: auto;

            overflow-x: hidden;

            padding: 28px 20px 50px;

            background:
                #eef2f7;

            user-select: none;

            -webkit-user-select: none;

        }


        /* =================================================
           PDF PAGES
        ================================================= */

        #pdfContainer {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 24px;

        }


        .pdf-page {

            position: relative;

            background: #ffffff;

            box-shadow:
                0 8px 30px
                rgba(15, 23, 42, 0.14);

            overflow: hidden;

            user-select: none;

            -webkit-user-select: none;

        }


        .pdf-page canvas {

            display: block;

            max-width: 100%;

            height: auto;

        }


        /* =================================================
           LOADING
        ================================================= */

        .loading {

            min-height:
                calc(100vh - 150px);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 15px;

            color: #64748b;

        }


        .loading-spinner {

            width: 52px;

            height: 52px;

            border-radius: 50%;

            border:
                4px solid #e2e8f0;

            border-top-color:
                #6d35f2;

            animation:
                spin .8s linear infinite;

        }


        @keyframes spin {

            to {

                transform:
                    rotate(360deg);

            }

        }


        .loading-text {

            font-size: 14px;

            font-weight: 650;

        }


        /* =================================================
           ERROR
        ================================================= */

        .error-screen {

            min-height:
                calc(100vh - 70px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;

        }


        .error-card {

            width:
                min(520px, 100%);

            padding: 40px 30px;

            background: #ffffff;

            border:
                1px solid #e2e8f0;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 14px 40px
                rgba(15, 23, 42, 0.08);

        }


        .error-icon {

            font-size: 48px;

            margin-bottom: 15px;

        }


        .error-card h2 {

            margin:
                0 0 10px;

        }


        .error-card p {

            margin:
                0 0 22px;

            color: #64748b;

            line-height: 1.6;

        }


        .error-back {

            height: 42px;

            padding: 0 20px;

            border: 0;

            border-radius: 10px;

            background: #6d35f2;

            color: #ffffff;

            font-family: inherit;

            font-weight: 700;

            cursor: pointer;

        }


        /* =================================================
           MOBILE
        ================================================= */

        @media (max-width: 600px) {

            .viewer-header {

                height: 62px;

                padding: 0 12px;

            }


            .viewer-title-icon {

                width: 36px;

                height: 36px;

                font-size: 19px;

            }


            #answerTitle {

                font-size: 14px;

            }


            .back-button {

                height: 36px;

                padding: 0 13px;

                font-size: 12px;

            }


            .viewer {

                height:
                    calc(100vh - 62px);

                padding:
                    15px 8px 30px;

            }


            #pdfContainer {

                gap: 14px;

            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="viewer-header">


    <div class="viewer-title">

        <div class="viewer-title-icon">
            📖
        </div>

        <div id="answerTitle">
            Answer
        </div>

    </div>


    <button
        type="button"
        class="back-button"
        id="backButton"
    >
        ← Back
    </button>


</header>


<!-- =====================================================
     VIEWER
===================================================== -->

<main
    id="viewer"
    class="viewer"
>

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-spinner"></div>

        <div class="loading-text">
            Loading Answer...
        </div>

    </div>


    <div
        id="pdfContainer"
    ></div>

</main>


<!-- =====================================================
     PDF.JS
===================================================== -->

<script type="module">

import * as pdfjsLib from
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";


// =====================================================
// PDF.JS WORKER
// =====================================================

pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";


// =====================================================
// URL PARAMETERS
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const file =
    params.get("file");


const title =
    params.get("title") ||
    "Answer";


// =====================================================
// ELEMENTS
// =====================================================

const viewer =
    document.getElementById(
        "viewer"
    );


const loading =
    document.getElementById(
        "loading"
    );


const pdfContainer =
    document.getElementById(
        "pdfContainer"
    );


const answerTitle =
    document.getElementById(
        "answerTitle"
    );


const backButton =
    document.getElementById(
        "backButton"
    );


// =====================================================
// TITLE
// =====================================================

if (answerTitle) {

    answerTitle.textContent =
        title;

}


// =====================================================
// BACK
// =====================================================

if (backButton) {

    backButton.addEventListener(
        "click",
        function () {

            window.history.back();

        }
    );

}


// =====================================================
// BLOCK RIGHT CLICK
// =====================================================

document.addEventListener(
    "contextmenu",
    function (event) {

        event.preventDefault();

        return false;

    },
    true
);


// =====================================================
// BLOCK SHORTCUTS
// =====================================================

document.addEventListener(
    "keydown",
    function (event) {

        const key =
            String(
                event.key
            ).toLowerCase();


        // Ctrl + P
        if (
            event.ctrlKey &&
            key === "p"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // Ctrl + S
        if (
            event.ctrlKey &&
            key === "s"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // Ctrl + Shift + S
        if (
            event.ctrlKey &&
            event.shiftKey &&
            key === "s"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // Ctrl + U
        if (
            event.ctrlKey &&
            key === "u"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // F12
        if (
            event.key === "F12"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // Ctrl + Shift + I
        if (
            event.ctrlKey &&
            event.shiftKey &&
            key === "i"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }


        // Ctrl + Shift + J
        if (
            event.ctrlKey &&
            event.shiftKey &&
            key === "j"
        ) {

            event.preventDefault();

            event.stopPropagation();

            return false;

        }

    },
    true
);


// =====================================================
// BLOCK DRAG
// =====================================================

document.addEventListener(
    "dragstart",
    function (event) {

        event.preventDefault();

    },
    true
);


// =====================================================
// BLOCK COPY
// =====================================================

document.addEventListener(
    "copy",
    function (event) {

        event.preventDefault();

    },
    true
);


// =====================================================
// BLOCK CUT
// =====================================================

document.addEventListener(
    "cut",
    function (event) {

        event.preventDefault();

    },
    true
);


// =====================================================
// PRINT BLOCK
// =====================================================

const printStyle =
    document.createElement(
        "style"
    );


printStyle.textContent = `

    @media print {

        html,
        body {

            display: none !important;

        }

    }

`;


document.head.appendChild(
    printStyle
);


// =====================================================
// VALIDATE FILE
// =====================================================

if (
    !file ||
    file.trim() === ""
) {

    showError(
        "No answer file was provided."
    );

}

else {

    loadPDF(
        file
    );

}


// =====================================================
// LOAD PDF
// =====================================================

async function loadPDF(
    filePath
) {

    try {

        console.log(
            "================================"
        );

        console.log(
            "Grade 11 Answer Viewer"
        );

        console.log(
            "PDF:",
            filePath
        );

        console.log(
            "Title:",
            title
        );

        console.log(
            "================================"
        );


        // ---------------------------------------------
        // LOAD PDF
        // ---------------------------------------------

        const loadingTask =
            pdfjsLib.getDocument({
                url: filePath
            });


        const pdf =
            await loadingTask.promise;


        console.log(
            "PDF loaded:",
            pdf.numPages,
            "pages"
        );


        // ---------------------------------------------
        // REMOVE LOADING
        // ---------------------------------------------

        if (loading) {

            loading.remove();

        }


        // ---------------------------------------------
        // RENDER ALL PAGES
        // ---------------------------------------------

        for (
            let pageNumber = 1;
            pageNumber <= pdf.numPages;
            pageNumber++
        ) {

            await renderPage(
                pdf,
                pageNumber
            );

        }


        console.log(
            "✅ All pages rendered"
        );

    }

    catch (error) {

        console.error(
            "PDF loading error:",
            error
        );


        showError(
            "Unable to load this answer. Please check the PDF file and try again."
        );

    }

}


// =====================================================
// RENDER PAGE
// =====================================================

async function renderPage(
    pdf,
    pageNumber
) {

    const page =
        await pdf.getPage(
            pageNumber
        );


    // ---------------------------------------------
    // PAGE SCALE
    // ---------------------------------------------

    const baseViewport =
        page.getViewport({
            scale: 1
        });


    const availableWidth =
        Math.max(
            300,
            viewer.clientWidth -
            40
        );


    const scale =
        Math.min(
            1.8,
            availableWidth /
            baseViewport.width
        );


    const viewport =
        page.getViewport({
            scale: scale
        });


    // ---------------------------------------------
    // PAGE WRAPPER
    // ---------------------------------------------

    const pageWrapper =
        document.createElement(
            "div"
        );


    pageWrapper.className =
        "pdf-page";


    pageWrapper.dataset.page =
        pageNumber;


    pageWrapper.style.width =
        `${viewport.width}px`;


    pageWrapper.style.height =
        `${viewport.height}px`;


    // ---------------------------------------------
    // CANVAS
    // ---------------------------------------------

    const canvas =
        document.createElement(
            "canvas"
        );


    const context =
        canvas.getContext(
            "2d",
            {
                alpha: false
            }
        );


    const outputScale =
        window.devicePixelRatio ||
        1;


    canvas.width =
        Math.floor(
            viewport.width *
            outputScale
        );


    canvas.height =
        Math.floor(
            viewport.height *
            outputScale
        );


    canvas.style.width =
        `${viewport.width}px`;


    canvas.style.height =
        `${viewport.height}px`;


    // ---------------------------------------------
    // RENDER
    // ---------------------------------------------

    const renderContext = {

        canvasContext:
            context,

        viewport:
            viewport,

        transform:
            outputScale !== 1
                ? [
                    outputScale,
                    0,
                    0,
                    outputScale,
                    0,
                    0
                ]
                : null

    };


    pageWrapper.appendChild(
        canvas
    );


    pdfContainer.appendChild(
        pageWrapper
    );


    await page.render(
        renderContext
    ).promise;

}


// =====================================================
// ERROR
// =====================================================

function showError(
    message
) {

    if (loading) {

        loading.remove();

    }


    viewer.className =
        "error-screen";


    viewer.innerHTML = `

        <div class="error-card">

            <div class="error-icon">
                ⚠️
            </div>

            <h2>
                Unable to Open Answer
            </h2>

            <p>
                ${message}
            </p>

            <button
                type="button"
                class="error-back"
                onclick="history.back()"
            >
                ← Go Back
            </button>

        </div>

    `;

}

</script>


</body>

</html>
