<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Grade 10 Model Papers</title>

    <link
        rel="stylesheet"
        href="grade10-model-papers.css"
    >

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>
            📘 Grade 10 Model Papers
        </h1>

        <button
            type="button"
            onclick="history.back()"
        >
            ← Back
        </button>

    </div>


    <!-- TERM GRID -->

    <div
        class="term-grid"
        id="termGrid"
    >

        <!-- =====================================
             1ST TERM
        ====================================== -->

        <div
            class="term-card"
            id="termCard1"
            data-term="1"
            role="button"
            tabindex="0"
        >

            <div class="term-icon">
                📚
            </div>

            <h2>
                1st Term
            </h2>

            <p>
                Grade 10 Model Papers
            </p>

        </div>


        <!-- =====================================
             2ND TERM
        ====================================== -->

        <div
            class="term-card"
            id="termCard2"
            data-term="2"
            role="button"
            tabindex="0"
        >

            <div class="term-icon">
                📚
            </div>

            <h2>
                2nd Term
            </h2>

            <p>
                Grade 10 Model Papers
            </p>

        </div>


        <!-- =====================================
             3RD TERM
        ====================================== -->

        <div
            class="term-card"
            id="termCard3"
            data-term="3"
            role="button"
            tabindex="0"
        >

            <div class="term-icon">
                📚
            </div>

            <h2>
                3rd Term
            </h2>

            <p>
                Grade 10 Model Papers
            </p>

        </div>

    </div>


    <!-- NO PAPERS MESSAGE -->

    <div
        id="noTermsMessage"
        style="
            display:none;
            text-align:center;
            padding:50px 20px;
        "
    >

        <div
            style="
                font-size:45px;
                margin-bottom:15px;
            "
        >
            🔒
        </div>

        <h2>
            No Model Papers Available
        </h2>

        <p>
            Model papers are currently unavailable.
            Please check again later.
        </p>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
========================================= -->

<script
    type="module"
    src="grade10-model-papers.js?v=1"
></script>


</body>

</html>
