<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>

<div class="login-box">

    <h1>Student Login</h1>

    <p class="subtitle">
        Model Paper Portal
    </p>

    <input
        type="text"
        id="studentId"
        placeholder="Student ID">

    <input
        type="password"
        id="password"
        placeholder="Password">

    <button id="loginBtn">
        Login
    </button>

    <p id="msg"></p>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
