<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Assessment Portal - Admin</title>

    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="sidebar">

    <h2>👨🏻‍💻 Admin</h2>

    <ul>
        <li class="active">📊 Dashboard</li>
        <li>👨‍🎓 Students</li>
        <li>📚 Papers</li>
        <li>📈 Reports</li>
        <li>⚙️ Settings</li>
        <li id="logoutBtn">🚪 Logout</li>
    </ul>

</div>

<div class="main">

    <header>

        <h1>Student Assessment Portal</h1>

    </header>

    <div class="cards">

        <div class="card">
            <h3>Total Students</h3>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="card">
            <h3>Total Paper Views</h3>
            <h2 id="totalViewed">0</h2>
        </div>

        <div class="card">
            <h3>Students</h3>
            <h2 id="onlineStudents">0</h2>
        </div>

    </div>

    <div class="toolbar">

        <input
            id="search"
            type="text"
            placeholder="🔍 Search Student ID">

        <button id="addStudentBtn">
            ➕ Add Student
        </button>

    </div>

    <table>

        <thead>

        <tr>

            <th>Student ID</th>
            <th>Viewed</th>
            <th>Password</th>
            <th>Action</th>

        </tr>

        </thead>

        <tbody id="studentTable">

        </tbody>

    </table>

</div>

<script src="session.js"></script>
<script type="module" src="admin.js"></script>

</body>
</html>
